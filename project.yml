name: VRMQuickLook
options:
  bundleIdPrefix: com.vroid
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.6

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 59748AM4YC
    ENABLE_HARDENED_RUNTIME: YES

targets:

  VRMQuickLook:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroid.VRMQuickLook
        PRODUCT_NAME: VRMQuickLook
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/App/VRMQuickLook.entitlements
    postBuildScripts:
      - name: Embed GLTFKit2
        script: |
          set -e
          SRC="${BUILT_PRODUCTS_DIR}/GLTFKit2.framework"
          DST="${BUILT_PRODUCTS_DIR}/VRMQuickLook.app/Contents/Frameworks/GLTFKit2.framework"
          mkdir -p "${BUILT_PRODUCTS_DIR}/VRMQuickLook.app/Contents/Frameworks"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            ditto "$SRC" "$DST"
          fi
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2
      - target: VRMPreviewExtension
        embed: true
      - target: VRMThumbnailExtension
        embed: true

  VRMPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PreviewExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroid.VRMQuickLook.PreviewExtension
        PRODUCT_NAME: VRMPreviewExtension
        INFOPLIST_FILE: Sources/PreviewExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/PreviewExtension/VRMPreviewExtension.entitlements
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2

  VRMThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ThumbnailExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroid.VRMQuickLook.ThumbnailExtension
        PRODUCT_NAME: VRMThumbnailExtension
        INFOPLIST_FILE: Sources/ThumbnailExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/ThumbnailExtension/VRMThumbnailExtension.entitlements
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2
