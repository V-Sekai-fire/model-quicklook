name: ModelQuickLook
options:
  bundleIdPrefix: com.vsekai
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.6

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:

  ModelQuickLook:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        resourceFileTypes:
          - icns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vsekai.ModelQuickLook
        PRODUCT_NAME: ModelQuickLook
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/App/ModelQuickLook.entitlements
    postBuildScripts:
      - name: Embed GLTFKit2
        alwaysOutOfDate: true
        script: |
          set -e
          SRC="${BUILT_PRODUCTS_DIR}/GLTFKit2.framework"
          DST="${BUILT_PRODUCTS_DIR}/ModelQuickLook.app/Contents/Frameworks/GLTFKit2.framework"
          mkdir -p "${BUILT_PRODUCTS_DIR}/ModelQuickLook.app/Contents/Frameworks"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            ditto "$SRC" "$DST"
          fi
    dependencies:
      - target: ModelPreviewExtension
        embed: true
      - target: ModelThumbnailExtension
        embed: true

  ModelPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PreviewExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vsekai.ModelQuickLook.PreviewExtension
        PRODUCT_NAME: ModelPreviewExtension
        INFOPLIST_FILE: Sources/PreviewExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/PreviewExtension/ModelPreviewExtension.entitlements
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2

  ModelThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ThumbnailExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vsekai.ModelQuickLook.ThumbnailExtension
        PRODUCT_NAME: ModelThumbnailExtension
        INFOPLIST_FILE: Sources/ThumbnailExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Sources/ThumbnailExtension/ModelThumbnailExtension.entitlements
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2
